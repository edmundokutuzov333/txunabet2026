name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  id-token: write

concurrency:
  group: oryon-production-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy Oryon production stack
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refresh lockfile in runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Run foundation integration suite
        env:
          FIREBASE_PROJECT_ID: ci-project
          FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
          GCLOUD_PROJECT: ci-project
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project ci-project "npm run test:integration"
      - name: Run security rules suite
        run: npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-oryon "npm run test:rules"
      - run: npm run build
      - name: Install and build Firebase Functions
        working-directory: functions
        run: |
          npm ci
          npm run build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Firestore, Functions and App Hosting
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes,functions,apphosting --project "$PROJECT_ID" --non-interactive
