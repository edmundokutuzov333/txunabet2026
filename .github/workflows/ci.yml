name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-api-key
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-public-app-id
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  functions:
    name: Functions typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npm test -- --runInBand
        working-directory: functions
