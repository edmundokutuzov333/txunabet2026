name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oryon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-api-key
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-public-app-id
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Foundation integration tests
    needs: quality
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      GCLOUD_PROJECT: ci-project
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project ci-project "npm run test:integration"

  build:
    name: Production build
    needs: [quality, integration]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-api-key
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-public-app-id
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build

  rules:
    name: Firestore and Storage security rules
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-oryon "npm run test:rules"

  functions:
    name: Functions build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npm test -- --runInBand
        working-directory: functions

  e2e:
    name: End-to-end browser smoke
    needs: [build, rules, integration]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-api-key
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-public-app-id
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-project.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      FIREBASE_PROJECT_ID: ci-project
      FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
