# Firebase App Hosting runtime configuration.
# Autoscaling is intentionally left to App Hosting defaults until real load,
# latency and concurrency measurements are available. A hard maxInstances: 1
# would turn traffic spikes into avoidable queueing and cold-start pressure.
runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
